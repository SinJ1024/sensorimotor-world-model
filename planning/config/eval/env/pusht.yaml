# @package _global_
#
# Push-T planning-eval config. State/goal fields match upstream LeWM.

world:
  env_name: swm/PushT-v1

eval:
  dataset_name: pusht_expert_eval
  callables:
    - method: _set_state
      args:
        state:
          value: state
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_state

dataset:
  keys_to_cache:
    - action
    - proprio
    - state
