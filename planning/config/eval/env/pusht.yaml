# @package _global_
#
# Push-T planning-eval config. Callables from the upstream Le-WM repo
# (lucas-maes/le-wm, config/eval/pusht.yaml).

world:
  env_name: swm/PushT-v1

eval:
  dataset_name: pusht_expert_eval
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

dataset:
  keys_to_cache:
    - action
    - proprio
    - state
