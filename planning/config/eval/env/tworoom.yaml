# @package _global_
#
# TwoRoom planning-eval environment config.
# (Reconstructed: the upstream repo shipped config/eval/base.yaml but not the
#  per-env configs referenced by planning_eval/generate_configs.py.)

world:
  env_name: swm/TwoRoom-v1

eval:
  dataset_name: tworoom_eval
  # The le-wm TwoRoom dataset stores start/goal as pos_agent/pos_target (not the
  # swm variation.* mechanism), and there is no seed column, so reset() would
  # place the agent/target randomly. These callables set the env's runtime
  # agent_position / target_position from the sampled dataset row before rollout.
  # (Reconstructed — validate that inverse reproduces ~100% success.)
  callables:
    - method: set_wrapper_attr
      args:
        name: {value: agent_position, in_dataset: false}
        value: {value: pos_agent, in_dataset: true}
    - method: set_wrapper_attr
      args:
        name: {value: target_position, in_dataset: false}
        value: {value: pos_target, in_dataset: true}

dataset:
  keys_to_cache:
    - action
    - proprio
