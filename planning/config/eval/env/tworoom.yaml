# @package _global_
#
# TwoRoom planning-eval environment config (matches upstream le-wm).
#
# Both the dataset's `proprio` (agent xy) and `pos_agent`/`pos_target` columns
# exist, so either callable mechanism resolves. We use le-wm's original
# `_set_state`/`_set_goal_state` with proprio/goal_proprio because that makes the
# success criterion (dist(agent, target_position)) match the goal *image* the
# planner conditions on: the goal frame shows the agent at its position
# goal_offset_steps later (== goal_proprio), NOT at the fixed pos_target marker.
# `_set_state` also writes a torch tensor directly, so the numpy/torch step()
# coercion patch in eval.py is a no-op here.
#
# Column check (swm inspect tworoom_eval): proprio (N,2) present; goal_proprio is
# auto-derived by evaluate_from_dataset. Verified on /scratch/.../tworoom_eval.h5.

world:
  env_name: swm/TwoRoom-v1

eval:
  dataset_name: tworoom_eval
  callables:
    # -- set initial agent state from the sampled start row
    - method: _set_state
      args:
        state:
          value: proprio
    # -- set goal state from the row goal_offset_steps later (auto-derived col)
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

dataset:
  keys_to_cache:
    - action
    - proprio
