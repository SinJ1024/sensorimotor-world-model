# @package _global_
#
# TwoRoom planning-eval config. Callables taken from the upstream Le-WM repo
# (lucas-maes/le-wm, config/eval/tworoom.yaml) — same swm env and dataset format,
# so these are the authoritative start/goal setters.
#
# Measured on this code: tworoom_inverse_lambda_0p1_seed0 scores 100% with these
# callables (DelftBlue job 222436, repo 66515bc), and every TwoRoom number in the
# policy-regularizer study was produced with them. The set_wrapper_attr /
# pos_agent,pos_target variant (and its "~39% with _set_state" note in dc1e008)
# lives on the add-h5-inspector side branch and predates the paper-CEM eval.py.

world:
  env_name: swm/TwoRoom-v1

eval:
  dataset_name: tworoom_eval
  callables:
    - method: _set_state
      args:
        state:
          value: proprio
    - method: _set_goal_state
      args:
        goal_state:
          value: goal_proprio

dataset:
  keys_to_cache:
    - action
    - proprio
