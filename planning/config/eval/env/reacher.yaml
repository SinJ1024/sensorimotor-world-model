# @package _global_
#
# Reacher planning-eval state restoration from upstream LeWM.

world:
  env_name: swm/ReacherDMControl-v0
  task: qpos_match

eval:
  dataset_name: reacher_eval
  callables:
    - method: set_state
      args:
        qpos:
          value: qpos
        qvel:
          value: qvel
    - method: set_target_qpos
      args:
        target_qpos:
          value: goal_qpos

dataset:
  keys_to_cache:
    - action
