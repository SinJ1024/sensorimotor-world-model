# Shared defaults for the dot-world experiments (single_dot, structured_dots).
dataset:
  image_size: 64
  dot_radius: 2
  max_displacement: 16
  allow_overlap: false
  train_samples: 250000
  eval_samples: 1000
model:
  latent_dim: 64
  hidden_dim: 256
training:
  seed: 42
  epochs: 100
  batch_size: 256
  lr: 5e-4
  lambda: 10.0
  eval_every: 10
  # Anti-collapse regularizer (the third model, weighted by `lambda`):
  #   inverse : â_t     = h(z_t, z_{t+1})            — the paper's default
  #   policy  : â_{t+1} = π(z_t, z_{t+1}[, a_t])     — predicts the next action
  # For `policy`, the dataset returns a_{t+1} from a state-conditioned policy
  # (toward the canvas centre); a_t stays random. See models.PolicyModel.
  reg_type: inverse
  policy_use_action: true   # include a_t in the policy input (has a shortcut risk)
  policy_gain: 0.5          # proportional gain of the target policy
